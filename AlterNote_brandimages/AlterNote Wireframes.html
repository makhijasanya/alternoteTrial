<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlterNote — Mobile Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eee8db;font-family:'DM Sans',sans-serif;padding:36px 40px 100px;min-height:100vh}
#root{max-width:1900px;margin:0 auto}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─────────────────────────────────────
   WIREFRAME PRIMITIVES
───────────────────────────────────── */
const W = {
  Status: () => <div style={{height:8,background:'#ccc'}} />,

  Header: ({title,back,action,dark,noBottom}) => (
    <div style={{padding:'9px 10px 8px',borderBottom:noBottom?'none':'1.5px solid #e5e5e5',display:'flex',alignItems:'center',gap:7,background:dark?'#1a1a2e':'#fff',flexShrink:0}}>
      {back && <div style={{width:20,height:20,borderRadius:5,background:dark?'rgba(255,255,255,.15)':'#f0f0f0',flexShrink:0}} />}
      <div style={{fontSize:13,fontWeight:700,color:dark?'#fff':'#1a1a2e',flex:1,fontFamily:"'DM Sans',sans-serif"}}>{title}</div>
      {action && <div style={{background:'#d9385e',color:'#fff',fontSize:10,fontWeight:700,borderRadius:6,padding:'2px 7px',fontFamily:"'DM Sans',sans-serif"}}>{action}</div>}
    </div>
  ),

  CrimsonHero: ({badge,title,sub}) => (
    <div style={{background:'#d9385e',padding:'14px 10px 12px',flexShrink:0}}>
      {badge && <div style={{fontSize:9,color:'rgba(255,255,255,.75)',letterSpacing:1,textTransform:'uppercase',marginBottom:3}}>{badge}</div>}
      <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:15,color:'#fff',lineHeight:1.2}}>{title}</div>
      {sub && <div style={{fontSize:10,color:'rgba(255,255,255,.75)',marginTop:2}}>{sub}</div>}
    </div>
  ),

  DarkHero: ({children}) => (
    <div style={{background:'#1a1a2e',padding:'12px 10px 14px',flexShrink:0}}>{children}</div>
  ),

  Steps: ({n=4,done=0}) => (
    <div style={{display:'flex',gap:4,padding:'7px 10px 3px',flexShrink:0}}>
      {Array.from({length:n},(_,i)=>(
        <div key={i} style={{flex:1,height:3,borderRadius:3,background:i<done?'#d9385e':'#e0e0e0'}} />
      ))}
    </div>
  ),

  StepLabel: ({text}) => <div style={{fontSize:10,color:'#999',padding:'0 10px 6px',fontFamily:"'DM Sans',sans-serif"}}>{text}</div>,

  Tabs: ({tabs,active=0}) => (
    <div style={{display:'flex',borderBottom:'1.5px solid #e5e5e5',background:'#fff',flexShrink:0}}>
      {tabs.map((t,i)=>(
        <div key={i} style={{flex:1,padding:'7px 2px',textAlign:'center',fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",color:i===active?'#d9385e':'#888',borderBottom:i===active?'2px solid #d9385e':'none',marginBottom:i===active?-1.5:0}}>{t}</div>
      ))}
    </div>
  ),

  Search: () => (
    <div style={{margin:'6px 8px',borderRadius:8,background:'#f5f5f5',height:26,border:'1.5px solid #e0e0e0',display:'flex',alignItems:'center',padding:'0 8px',gap:5,flexShrink:0}}>
      <div style={{width:10,height:10,borderRadius:'50%',border:'1.5px solid #bbb'}} />
      <div style={{height:5,borderRadius:3,background:'#ddd',flex:1}} />
    </div>
  ),

  Chips: ({chips,active=0}) => (
    <div style={{display:'flex',gap:5,padding:'2px 8px 6px',overflow:'hidden',flexShrink:0}}>
      {chips.map((c,i)=>(
        <div key={i} style={{borderRadius:20,padding:'2px 8px',fontSize:10,fontWeight:700,background:i===active?'#d9385e':'#f0f0f0',color:i===active?'#fff':'#777',whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>{c}</div>
      ))}
    </div>
  ),

  Line: ({w='100%',dark,accent,mt=3,mb=3,h=6}) => (
    <div style={{height:h,borderRadius:3,margin:`${mt}px 0 ${mb}px`,background:accent?'#d9385e':dark?'rgba(255,255,255,.5)':'#e0e0e0',width:w}} />
  ),

  Lines: ({n=3,last='65%',light}) => (
    <div>
      {Array.from({length:n},(_,i)=>(
        <div key={i} style={{height:6,borderRadius:3,margin:'3px 0',background:light?'rgba(255,255,255,.25)':'#e0e0e0',width:i===n-1?last:'100%'}} />
      ))}
    </div>
  ),

  Card: ({children,mb=5,accent,style={}}) => (
    <div style={{border:accent?'1.5px solid #d9385e':'1.5px solid #e5e5e5',borderRadius:8,margin:`0 8px ${mb}px`,padding:8,background:'#fff',...style}}>{children}</div>
  ),

  Block: ({h=30,bg='#f0f0f0',mb=5,children,style={}}) => (
    <div style={{borderRadius:6,margin:`0 8px ${mb}px`,background:bg,minHeight:h,padding:children?8:0,...style}}>{children}</div>
  ),

  Btn: ({label,primary=true,mb=5,color}) => (
    <div style={{margin:`4px 8px ${mb}px`,borderRadius:8,background:color||(primary?'#d9385e':'#f0f0f0'),height:28,display:'flex',alignItems:'center',justifyContent:'center',border:primary?'none':'1.5px solid #ddd'}}>
      <span style={{fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif",color:primary?'#fff':'#666'}}>{label}</span>
    </div>
  ),

  Input: ({label,mb=5}) => (
    <div style={{margin:`0 8px ${mb}px`}}>
      {label&&<div style={{fontSize:9,color:'#aaa',fontWeight:700,marginBottom:2,fontFamily:"'DM Sans',sans-serif",textTransform:'uppercase'}}>{label}</div>}
      <div style={{borderRadius:6,background:'#f8f8f8',height:22,border:'1.5px solid #e0e0e0'}} />
    </div>
  ),

  Textarea: ({label,h=40}) => (
    <div style={{margin:'0 8px 5px'}}>
      {label&&<div style={{fontSize:9,color:'#aaa',fontWeight:700,marginBottom:2,fontFamily:"'DM Sans',sans-serif",textTransform:'uppercase'}}>{label}</div>}
      <div style={{borderRadius:6,background:'#f8f8f8',height:h,border:'1.5px solid #e0e0e0'}} />
    </div>
  ),

  Avatar: ({size=26,color='#e0e0e0'}) => (
    <div style={{width:size,height:size,borderRadius:size/3.5,background:color,flexShrink:0}} />
  ),

  Row: ({hasSub,hasTag,hasStatus,last,active}) => (
    <div style={{display:'flex',alignItems:'center',gap:7,padding:'7px 8px',borderBottom:last?'none':'1px solid #f5f5f5',background:active?'#fef2f4':'#fff',borderLeft:active?'2.5px solid #d9385e':'none',flexShrink:0}}>
      <div style={{width:26,height:26,borderRadius:7,background:active?'#d9385e':'#e0e0e0',flexShrink:0}} />
      <div style={{flex:1}}>
        <div style={{height:6,borderRadius:3,background:active?'#c0c0c0':'#ddd',width:'65%',marginBottom:3}} />
        {hasSub&&<div style={{height:5,borderRadius:3,background:'#ebebeb',width:'45%'}} />}
      </div>
      {hasTag&&<div style={{width:26,height:12,borderRadius:6,background:'#fffbeb',border:'1px solid #fde68a'}} />}
      {hasStatus&&<div style={{width:38,height:12,borderRadius:6,background:'#fffbeb',border:'1px solid #fde68a'}} />}
    </div>
  ),

  OrderCard: ({status,hasTags,urgent}) => (
    <div style={{border:'1.5px solid #e5e5e5',borderRadius:8,margin:'0 8px 6px',padding:'8px 9px',background:'#fff',flexShrink:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
        <div style={{flex:1,marginRight:8}}>
          <div style={{height:7,borderRadius:3,background:'#ddd',width:'65%',marginBottom:3}} />
          <div style={{height:5,borderRadius:3,background:'#ebebeb',width:'50%'}} />
        </div>
        <div style={{width:44,height:14,borderRadius:7,background:status==='prg'?'#fffbeb':status==='fit'?'#eff6ff':status==='cmp'?'#ecfdf5':'#f8fafc',border:`1px solid ${status==='prg'?'#fde68a':status==='fit'?'#bfdbfe':status==='cmp'?'#a7f3d0':'#e0e0e0'}`}} />
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',gap:4}}>
          {hasTags&&<><div style={{width:22,height:11,borderRadius:6,background:'#fef2f4',border:'1px solid #fecdd3'}} /><div style={{width:28,height:11,borderRadius:6,background:'#fffbeb',border:'1px solid #fde68a'}} /></>}
        </div>
        {urgent&&<div style={{height:5,borderRadius:3,background:'#fde68a',width:30}} />}
      </div>
    </div>
  ),

  Nav: ({tabs=5,active=0,role='admin'}) => {
    const color=role==='tailor'?'#059669':role==='help'?'#2563eb':'#d9385e';
    return (
      <div style={{borderTop:'1.5px solid #e5e5e5',display:'flex',padding:'5px 0 3px',background:'#fff',flexShrink:0}}>
        {Array.from({length:tabs},(_,i)=>(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
            <div style={{width:14,height:14,borderRadius:3,background:i===active?color:'#e0e0e0'}} />
            <div style={{width:18,height:3,borderRadius:2,background:'#eee'}} />
          </div>
        ))}
      </div>
    );
  },

  Info: ({text,color='amber'}) => {
    const bg={amber:'#fffbeb',blue:'#eff6ff',green:'#ecfdf5',red:'#fef2f4'}[color]||'#fffbeb';
    const tc={amber:'#92400e',blue:'#1e40af',green:'#065f46',red:'#be123c'}[color]||'#92400e';
    return (
      <div style={{background:bg,margin:'0 8px 5px',borderRadius:6,padding:'5px 7px',flexShrink:0}}>
        <div style={{fontSize:10,color:tc,lineHeight:1.4,fontFamily:"'DM Sans',sans-serif"}}>{text}</div>
      </div>
    );
  },

  SLabel: ({text}) => <div style={{fontSize:9,color:'#aaa',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,padding:'6px 8px 3px',fontFamily:"'DM Sans',sans-serif"}}>{text}</div>,

  Sep: () => <div style={{height:1,background:'#f0f0f0',margin:'2px 8px'}} />,

  MeasRow: ({target}) => (
    <div style={{display:'flex',alignItems:'center',gap:5,padding:'4px 8px',flexShrink:0}}>
      <div style={{height:6,borderRadius:3,background:'#ddd',width:'30%'}} />
      <div style={{flex:1,height:20,borderRadius:5,background:'#f5f5f5',border:'1.5px solid #e0e0e0'}} />
      {target&&<><div style={{fontSize:10,color:'#999'}}>→</div><div style={{flex:1,height:20,borderRadius:5,background:'#fef2f4',border:'1.5px solid #d9385e'}} /></>}
    </div>
  ),

  StatusPills: ({active=1}) => (
    <div style={{display:'flex',gap:4,flexWrap:'wrap',padding:'5px 8px'}}>
      {['Received','In Progress','Fitting','Completed','Delivered'].map((s,i)=>(
        <div key={i} style={{padding:'3px 7px',borderRadius:6,border:'1.5px solid',borderColor:i===active?'#d9385e':'#e0e0e0',background:i===active?'#d9385e':'#fff',fontSize:9,fontWeight:700,fontFamily:"'DM Sans',sans-serif",color:i===active?'#fff':'#aaa'}}>{s}</div>
      ))}
    </div>
  ),

  Bubble: ({out,lines=2}) => (
    <div style={{display:'flex',justifyContent:out?'flex-end':'flex-start',padding:'2px 8px',flexShrink:0}}>
      <div style={{background:out?'#d9385e':'#f0f0f0',borderRadius:out?'10px 10px 0 10px':'10px 10px 10px 0',padding:'5px 8px',maxWidth:'70%',minWidth:50}}>
        {Array.from({length:lines},(_,i)=>(
          <div key={i} style={{height:5,borderRadius:3,background:out?'rgba(255,255,255,.4)':'#ddd',width:i===lines-1?'60%':'100%',marginBottom:i<lines-1?3:0}} />
        ))}
      </div>
    </div>
  ),

  Fab: () => (
    <div style={{position:'absolute',bottom:58,right:10,width:30,height:30,background:'#d9385e',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{color:'#fff',fontSize:18,lineHeight:1,marginTop:-1}}>+</div>
    </div>
  ),
};

/* ─────────────────────────────────────
   PHONE FRAME
───────────────────────────────────── */
const Phone = ({label,isNew,role,note,children}) => {
  const rc={admin:{bg:'#fef2f4',c:'#d9385e'},help:{bg:'#eff6ff',c:'#2563eb'},tailor:{bg:'#ecfdf5',c:'#059669'},all:{bg:'#f5f3ff',c:'#7c3aed'},onboarding:{bg:'#f8fafc',c:'#334155'}}[role]||{bg:'#f8fafc',c:'#334155'};
  const rLabel={admin:'Admin',help:'Help/Asst',tailor:'Tailor',all:'All Roles',onboarding:'Onboarding'}[role]||'';
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:7,width:162}}>
      <div style={{textAlign:'center',display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',justifyContent:'center'}}>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:700,color:'#1a1a2e',lineHeight:1.2}}>{label}</div>
        {isNew&&<span style={{background:'#f59e0b',color:'#fff',fontSize:9,padding:'1px 6px',borderRadius:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>NEW</span>}
      </div>
      {role&&<div style={{background:rc.bg,color:rc.c,fontSize:10,padding:'1px 8px',borderRadius:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",border:`1px solid ${rc.c}40`}}>{rLabel}</div>}
      <div style={{width:162,background:'#fff',borderRadius:22,border:'2.5px solid #1a1a2e',boxShadow:'4px 4px 0 #1a1a2e',overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
        {children}
      </div>
      {note&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:'#888',textAlign:'center',maxWidth:145,lineHeight:1.3}}>{note}</div>}
    </div>
  );
};

const Arr = ({label}) => (
  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,alignSelf:'center',marginTop:50,flexShrink:0}}>
    {label&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:'#aaa',whiteSpace:'nowrap'}}>{label}</div>}
    <div style={{fontSize:22,color:'#bbb',lineHeight:1}}>→</div>
  </div>
);

const FlowSection = ({num,title,desc,role,children}) => {
  const colors={admin:'#d9385e',help:'#2563eb',tailor:'#059669',all:'#7c3aed',onboarding:'#334155',gap:'#f59e0b'};
  const c=colors[role]||'#1a1a2e';
  return (
    <div style={{marginBottom:64}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
        <div style={{width:38,height:38,borderRadius:'50%',background:c,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'DM Sans',sans-serif",fontSize:18,fontWeight:700,flexShrink:0}}>{num}</div>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,fontWeight:400,color:'#1a1a2e',lineHeight:1}}>{title}</div>
          {desc&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:15,color:'#888',marginTop:1}}>{desc}</div>}
        </div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:20,alignItems:'flex-start',paddingLeft:50}}>{children}</div>
    </div>
  );
};

/* ─────────────────────────────────────
   ALL SCREENS
───────────────────────────────────── */

/* === FLOW 1: ONBOARDING === */
const Splash = () => (
  <Phone label="Splash" role="onboarding">
    <W.Status/>
    <div style={{background:'#1a1a2e',flex:1,padding:'30px 14px 16px',display:'flex',flexDirection:'column',alignItems:'center',minHeight:260}}>
      <div style={{width:32,height:32,borderRadius:8,background:'#d9385e',marginBottom:8}} />
      <W.Line w="55%" dark h={12} mb={5} mt={0} />
      <W.Line w="70%" dark h={5} mb={20} />
      <div style={{display:'flex',gap:4,marginBottom:22}}>
        {[1,0,0].map((a,i)=><div key={i} style={{width:a?18:5,height:4,borderRadius:4,background:a?'#fff':'rgba(255,255,255,.3)'}} />)}
      </div>
      <div style={{width:'100%',background:'#fff',borderRadius:9,padding:12,marginBottom:10}}>
        <W.Lines n={2} last="50%" light={false}/>
      </div>
      <W.Btn label="Get Started — Free" primary mb={6} />
      <W.Line w="60%" dark mb={0} />
    </div>
  </Phone>
);

const Login = () => (
  <Phone label="Login" role="onboarding">
    <W.Status/>
    <div style={{background:'#1a1a2e',padding:'22px 14px 16px',display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{width:24,height:24,borderRadius:6,background:'#d9385e',marginBottom:6}} />
      <W.Line w="45%" dark h={10} mb={3} mt={0}/>
      <W.Line w="55%" dark mb={0}/>
    </div>
    <div style={{padding:'0 0 4px'}}>
      <W.Card mb={0} style={{margin:'10px 8px 6px'}}>
        <W.Input label="Mobile Number" mb={6}/>
        <W.Input label="Password" mb={8}/>
        <W.Btn label="Sign In" primary mb={0}/>
      </W.Card>
      <div style={{padding:'6px 10px',display:'flex',justifyContent:'center'}}>
        <div style={{height:5,borderRadius:3,background:'#e0e0e0',width:'55%'}} />
      </div>
    </div>
    <div style={{background:'#1a1a2e',padding:'8px'}}>
      <div style={{height:5,borderRadius:3,background:'rgba(255,255,255,.15)',width:'40%',margin:'0 auto'}} />
    </div>
  </Phone>
);

const OTPVerify = () => (
  <Phone label="OTP Verify" isNew role="onboarding" note="Forgot password → phone → OTP → reset PIN">
    <W.Status/>
    <div style={{background:'#1a1a2e',padding:'20px 14px 14px',display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{width:24,height:24,borderRadius:6,background:'#d9385e',marginBottom:6}} />
      <W.Line w="50%" dark h={10} mb={4} mt={0}/>
      <W.Line w="65%" dark mb={0}/>
    </div>
    <W.Info text="OTP sent to +91 98765 XXXXX" color="blue"/>
    <div style={{padding:'14px 8px 8px',display:'flex',gap:7,justifyContent:'center'}}>
      {[1,1,0,0].map((f,i)=>(
        <div key={i} style={{width:32,height:36,borderRadius:8,border:`2px solid ${f?'#d9385e':'#e0e0e0'}`,background:f?'#fef2f4':'#f8f8f8',display:'flex',alignItems:'center',justifyContent:'center'}}>
          {f?<div style={{width:8,height:8,borderRadius:'50%',background:'#d9385e'}} />:null}
        </div>
      ))}
    </div>
    <W.Line w="50%" mb={12} mt={6} style={{margin:'6px auto 12px'}}/>
    <W.Btn label="Verify OTP" primary mb={5}/>
    <div style={{textAlign:'center',padding:'0 8px 10px'}}>
      <div style={{height:5,borderRadius:3,background:'#e0e0e0',width:'50%',margin:'0 auto'}} />
    </div>
  </Phone>
);

const ProfileSelect = () => (
  <Phone label="Profile Select" role="onboarding" note="One device, multiple staff">
    <W.Status/>
    <div style={{padding:'14px 10px 8px'}}>
      <W.Line w="70%" dark h={10} mb={4} mt={0}/>
      <W.Line w="50%" mb={12}/>
    </div>
    {[{c:'#d9385e',active:true},{c:'#eff6ff'},{c:'#ecfdf5'},{c:'#fffbeb'}].map((p,i)=>(
      <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:9,margin:'0 8px 6px',border:`2px solid ${p.active?'#d9385e':'#e5e5e5'}`,background:p.active?'#fef2f4':'#fff'}}>
        <div style={{width:30,height:30,borderRadius:9,background:p.c,flexShrink:0}} />
        <div style={{flex:1}}>
          <div style={{height:6,borderRadius:3,background:'#ddd',width:'60%',marginBottom:3}} />
          <div style={{height:5,borderRadius:3,background:'#ebebeb',width:'40%'}} />
        </div>
        {p.active&&<div style={{width:14,height:14,borderRadius:4,background:'#d9385e'}} />}
      </div>
    ))}
    <div style={{padding:'8px 10px 4px',textAlign:'center'}}>
      <div style={{height:5,borderRadius:3,background:'#e0e0e0',width:'45%',margin:'0 auto 8px'}} />
      <div style={{display:'flex',gap:7,justifyContent:'center',marginBottom:10}}>
        {[1,1,0,0].map((f,i)=>(
          <div key={i} style={{width:28,height:32,borderRadius:7,border:`2px solid ${f?'#d9385e':'#e0e0e0'}`,background:f?'#fef2f4':'#f8f8f8'}} />
        ))}
      </div>
      <W.Btn label="Enter Dashboard" primary mb={0}/>
    </div>
  </Phone>
);

const BizSetup = () => (
  <Phone label="Business Setup" role="onboarding" note="Step 1 of 4">
    <W.Status/>
    <W.CrimsonHero badge="Step 1 of 4" title="Set up your boutique" sub="Appears on all invoices"/>
